name: Deploy to Netlify

# Trigger when a pull request is closed (merged) and its base branch is master
on:
  pull_request:
    types: [closed]

jobs:
  deploy:
    name: Deploy docs → Netlify
    runs-on: ubuntu-latest
    # only run when a pull request was merged and the target branch is `master`
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify (via CLI)
        run: |
          # show version then deploy
          netlify --version
          netlify deploy --dir=docs --prod --no-build --site="${{ secrets.NETLIFY_SITE_ID }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
